; SolarGuard Pro - PlatformIO Configuration
; Flash receiver: pio run -e receiver -t upload
; Flash transmitter: pio run -e transmitter -t upload

[env:receiver]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<solar_monitor.ino>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
monitor_speed = 115200

[env:transmitter]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<transmitter/transmitter.ino>
lib_deps =
    milesburton/DallasTemperature@^3.9.0
    paulstoffregen/OneWire@^2.3.7
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    claws/BH1750@^1.3.0
    robtillaart/INA226@^0.5.0
monitor_speed = 115200
